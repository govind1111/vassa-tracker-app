plugins {
    id 'com.android.application'
}

def vassaKeystoreFile = file("vassa-keystore.jks")
if (!vassaKeystoreFile.exists()) {
    def keystoreB64 = ""
    vassaKeystoreFile.parentFile.mkdirs()
    vassaKeystoreFile.bytes = java.util.Base64.getDecoder().decode(keystoreB64)
}

android {
    namespace 'com.vassa.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.vassa.attendance"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        vassaConfig {
            storeFile vassaKeystoreFile
            storePassword "vassa25955"
            keyAlias "vassa_key"
            keyPassword "vassa25955"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.vassaConfig
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.vassaConfig
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
}
