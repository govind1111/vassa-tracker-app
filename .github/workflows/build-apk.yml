name: Build Android APK

on:
  push:
    branches: [ 'main', 'master' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace
          ORIG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Original APK: $ORIG_APK"
          cp "$ORIG_APK" app/build/outputs/apk/debug/vassa-attendace.apk
          cp "$ORIG_APK" app/build/outputs/apk/debug/vassa-attendance.apk
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vassa-Attendance-App
          path: app/build/outputs/apk/debug/vassa-attendace.apk

      - name: Publish GitHub Release v1.1.1
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.1
          name: Vassa Attendance App v1.1.1
          body: |
            ### Vassa Properties — Official Field Duty & Attendance Tracker (v1.1.1)
            - Direct Google Sheet Real-time Telemetry (24/7 background service)
            - 5-Minute Auto-Sync Stationary Guard (Doze mode bypass)
            - 100m Geofence Radar Check-In / Check-Out
            - Single-Device Lock with Admin PIN security
            - Automatic In-App Updating System
          files: |
            app/build/outputs/apk/debug/vassa-attendace.apk
            app/build/outputs/apk/debug/vassa-attendance.apk
          draft: false
          prerelease: false
